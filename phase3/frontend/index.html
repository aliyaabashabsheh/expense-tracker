<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Expense Tracker</span>
    </div>
  </nav>

  <main class="container py-4">

    <div id="alerts"></div>

    <div class="summary-grid">
      <div class="card h-100">
        <div class="card-body">
          <p class="text-secondary mb-1">Total spent</p>
          <p class="fs-3 mb-0" id="total">0.00</p>
        </div>
      </div>
      <div class="card h-100">
        <div class="card-body">
          <p class="text-secondary mb-1">Number of expenses</p>
          <p class="fs-3 mb-0" id="count">0</p>
        </div>
      </div>
      <div class="card h-100">
        <div class="card-body">
          <p class="text-secondary mb-1">Highest expense</p>
          <p class="fs-3 mb-0" id="highest">0.00</p>
        </div>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-body">
        <h2 class="h6 text-secondary">Spending by category</h2>
        <div class="chart-wrap"><canvas id="chart"></canvas></div>
      </div>
    </div>

    <div id="loading" class="text-center my-5 d-none">
      <div class="spinner-border" role="status"></div>
      <p class="text-secondary mt-2 mb-0">Loading the expenses...</p>
    </div>

    <h2 class="h5 mb-3">Add an expense</h2>
    <form id="addForm" class="row g-3 mb-5" novalidate>
      <div class="col-12 col-md-4">
        <label class="form-label" for="addTitle">Title</label>
        <input class="form-control" type="text" id="addTitle" autocomplete="off">
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label" for="addAmount">Amount</label>
        <input class="form-control" type="number" id="addAmount" step="0.01" min="0" placeholder="0.00">
      </div>
      <div class="col-6 col-md-3">
        <label class="form-label" for="addCategory">Category</label>
        <select class="form-select" id="addCategory">
          <option value="">Choose one</option>
          <option>Food</option>
          <option>Transport</option>
          <option>Bills</option>
          <option>Entertainment</option>
          <option>Other</option>
        </select>
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label" for="addDate">Date</label>
        <input class="form-control" type="date" id="addDate">
      </div>
      <div class="col-6 col-md-1 d-flex align-items-end">
        <button class="btn btn-primary w-100" type="submit">Add</button>
      </div>
    </form>

    <div class="toolbar mb-3">
      <h2 class="h5 mb-0 me-auto">Expenses</h2>
      <input class="form-control" type="search" id="search" placeholder="Search by title">
      <select class="form-select" id="filter">
        <option value="All">All</option>
        <option>Food</option>
        <option>Transport</option>
        <option>Bills</option>
        <option>Entertainment</option>
        <option>Other</option>
      </select>
      <button class="btn btn-outline-secondary" type="button" id="export">Export CSV</button>
    </div>

    <p id="empty" class="text-secondary d-none">No expenses to show.</p>

    <div class="table-responsive">
      <table class="table align-middle">
        <thead>
          <tr>
            <th scope="col" class="sortable" data-sort="title">Title <span class="caret"></span></th>
            <th scope="col" class="sortable" data-sort="amount">Amount <span class="caret"></span></th>
            <th scope="col" class="sortable" data-sort="category">Category <span class="caret"></span></th>
            <th scope="col" class="sortable" data-sort="date">Date <span class="caret"></span></th>
            <th scope="col" class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

  </main>

  <div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit expense</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="editForm" class="row g-3" novalidate>
            <div class="col-12">
              <label class="form-label" for="editTitle">Title</label>
              <input class="form-control" type="text" id="editTitle" autocomplete="off">
            </div>
            <div class="col-6">
              <label class="form-label" for="editAmount">Amount</label>
              <input class="form-control" type="number" id="editAmount" step="0.01" min="0">
            </div>
            <div class="col-6">
              <label class="form-label" for="editCategory">Category</label>
              <select class="form-select" id="editCategory">
                <option>Food</option>
                <option>Transport</option>
                <option>Bills</option>
                <option>Entertainment</option>
                <option>Other</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label" for="editDate">Date</label>
              <input class="form-control" type="date" id="editDate">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="editSave">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
